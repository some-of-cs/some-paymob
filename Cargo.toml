[package]\nname = "some-paymob"\nversion = "0.1.0"\nedition = "2024"\nrust-version = "1.85"\nlicense = "MIT OR Apache-2.0"\ndescription = "Idiomatic, memory-safe, zero-data-race Rust microkernel SDK and constant-time webhook verification engine for Paymob across MENA & Pakistan."\nrepository = "https://github.com/some-of-cs/some-paymob"\nkeywords = ["paymob", "payments", "fintech", "mena", "sdk"]\ncategories = ["api-bindings", "web-programming::http-client"]\n\n[features]\ndefault = ["core", "webhooks", "intentions", "manage", "inquiries", "quicklinks", "splits", "saved-cards", "subscriptions", "payouts", "onboarding", "rustls-tls"]\ncore = ["rustls-tls"]\nwebhooks = ["core", "dep:hmac", "dep:sha2", "dep:subtle", "dep:hex"]\nwebhook-engine = ["webhooks"]\nintentions = ["core"]\nlegacy-v2 = ["core"]\nmanage = ["core"]\ninquiries = ["core"]\nquicklinks = ["core"]\nsplits = ["core"]\ntransactions = ["manage", "inquiries"]\nsaved-cards = ["core"]\ntokens = ["saved-cards"]\nsubscriptions = ["core"]\npayouts = ["core"]\nonboarding = ["core"]\npartner-onboarding = ["onboarding"]\nsome-payments-adapter = ["core", "webhooks", "intentions", "manage", "saved-cards", "subscriptions", "splits", "payouts"]\nsome-payment-trait = ["some-payments-adapter"]\ntest-utils = ["core", "webhooks", "dep:wiremock"]\nfull = ["core", "webhooks", "intentions", "legacy-v2", "manage", "inquiries", "quicklinks", "splits", "transactions", "saved-cards", "subscriptions", "payouts", "onboarding", "some-payments-adapter", "test-utils"]\nrustls-tls = ["reqwest/rustls-tls"]\nnative-tls = ["reqwest/native-tls"]\n\n[dependencies]\narc-swap = "1.7"\nbase64 = "0.22"\nhex = { version = "0.4", optional = true }\nhmac = { version = "0.12", optional = true }\nrand = "0.8"\nreqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }\nsecrecy = { version = "0.10", features = ["serde"] }\nserde = { version = "1.0", features = ["derive"] }\nserde_json = "1.0"\nsha2 = { version = "0.10", optional = true }\nsubtle = { version = "2.6", optional = true }\nthiserror = "2.0"\ntokio = { version = "1.40", features = ["sync", "time", "macros", "rt"] }\ntracing = "0.1"\nurl = "2.5"\nuuid = { version = "1.10", features = ["v4"] }\nwiremock = { version = "0.6", optional = true }\nzeroize = { version = "1.8", features = ["derive"] }\n\n[dev-dependencies]\nactix-rt = "2"\nactix-web = "4"\ntokio = { version = "1.40", features = ["full"] }\nwiremock = "0.6"\n\n[[example]]\nname = "actix_server"\nrequired-features = ["full"]\n\n[package.metadata.docs.rs]\nall-features = true\nrustdoc-args = ["--cfg", "docsrs"]\n