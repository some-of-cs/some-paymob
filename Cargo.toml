[package]
name = "some-paymob"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Idiomatic, memory-safe, zero-data-race Rust microkernel SDK and constant-time webhook verification engine for Paymob across MENA & Pakistan."
repository = "https://github.com/some-of-cs/some-paymob"
keywords = ["paymob", "payments", "fintech", "mena", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]

[features]
default = ["core", "webhooks", "rustls-tls"]
core = []
webhooks = ["core"]
webhook-engine = ["webhooks"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]

[dependencies]
arc-swap = "1.7"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.40", features = ["sync", "time", "macros", "rt"] }
tracing = "0.1"
url = "2.5"
uuid = { version = "1.10", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
